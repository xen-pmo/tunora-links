body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:2.2rem 1.25rem;background:#0B0B0F radial-gradient(60% 38% at 50% 0,rgba(255,91,46,0.16),transparent) no-repeat;color:#F2F2F5;font:400 1rem/1.5 "Geist", "Segoe UI", system-ui, sans-serif}
.card{width:min(100%,460px);text-align:center}

.role{margin:0 0 1.6rem;color:#9A9AA6;font-size:1.02rem;text-wrap:balance}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;min-height:92px;padding:.9rem .4rem;color:#F2F2F5;text-decoration:none;font-size:.88rem;font-weight:500;background:#141419;border:1px solid #26262E;border-radius:14px;transition:border-color .15s,color .15s,transform .15s}
.tile svg{width:30px;height:30px;fill:currentColor}
.tile:hover{border-color:#FF5B2E;color:#FF5B2E}
.cta{display:block;margin-top:1rem;padding:.95rem 1rem;background:#FF5B2E;color:#0B0B0F;font-weight:700;font-size:1.02rem;text-decoration:none;border-radius:14px;transition:filter .15s,transform .15s}
.cta:hover{filter:brightness(1.08)}
.note{margin:1.4rem 0 0;font-size:.82rem;color:#9A9AA6}
a:focus-visible{outline:3px solid #FF5B2E;outline-offset:3px}
@media (prefers-reduced-motion:no-preference){.tile:hover,.cta:hover{transform:translateY(-2px)}}
@media (max-width:340px){.grid{grid-template-columns:repeat(2,1fr)}}
